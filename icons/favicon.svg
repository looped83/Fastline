<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Intervallfasten">
  <!-- Dunkle Variante, fest eingestellt – wie das Homescreen-Icon.
       Die helle Palette steht in tools/make-icons.py unter THEMES. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#282D37"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <!-- userSpaceOnUse: bleibt senkrecht, unabhängig von Transformationen -->
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50">
      <stop offset="0%" stop-color="#6886FF"/>
      <stop offset="100%" stop-color="#2EDECB"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.40"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <g fill="none" stroke-linecap="round">
    <!-- farbiger Lichtschein hinter dem Bogen -->
    <path d="M32 12 A20 20 0 0 1 32 52 A20 20 0 0 1 32 12"
          stroke="url(#arc)" stroke-width="8.4" stroke-opacity="0.45"
          stroke-dasharray="125.66" stroke-dashoffset="46.5" filter="url(#soft)"/>
    <!-- Glasröhre -->
    <circle cx="32" cy="32" r="20" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6.8"/>
    <!-- Farbfüllung: Kreisbahn ab 12 Uhr im Uhrzeigersinn, 63 % gefüllt -->
    <path d="M32 12 A20 20 0 0 1 32 52 A20 20 0 0 1 32 12"
          stroke="url(#arc)" stroke-width="6.8"
          stroke-dasharray="125.66" stroke-dashoffset="46.5"/>
    <!-- Kantenlicht außen und innen -->
    <circle cx="32" cy="32" r="23.1" stroke="url(#rim)" stroke-width="0.9"/>
    <circle cx="32" cy="32" r="16.9" stroke="url(#rim)" stroke-width="0.8"/>
  </g>
</svg>
