<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Intervallfasten</title>
  <meta name="description" content="Ein ruhiges, persönliches Dashboard für das tägliche Intervallfasten – zeigt sofort, wo du in deinem Fastenzyklus stehst.">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0B0D" media="(prefers-color-scheme: dark)">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fasten">

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="app" id="app" data-mode="fasting">

    <main class="layout">

      <!-- ===================== Hauptanzeige ===================== -->
      <section class="hero" aria-labelledby="statusHeadline">
        <h1 class="hero__status" id="statusHeadline" aria-live="polite">&nbsp;</h1>
        <p class="hero__meta">
          <span class="hero__clock" id="clock">--:--</span>
          <span class="hero__sep" aria-hidden="true"></span>
          <span id="modeLabel"></span>
        </p>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200" role="img" aria-labelledby="ringTitle" aria-describedby="ringCaption">
            <title id="ringTitle">Fortschritt des Fastenfensters</title>
            <defs>
              <!-- userSpaceOnUse: Bogen und Fortschritts-Punkt teilen denselben
                   Farbraum, dadurch trifft der Punkt exakt die Bogenfarbe. -->
              <linearGradient id="ringGradient" gradientUnits="userSpaceOnUse"
                              x1="14" y1="14" x2="186" y2="186">
                <stop id="ringGradientFrom" offset="0%" stop-color="#4C6FFF"></stop>
                <stop id="ringGradientTo" offset="100%" stop-color="#21C7B6"></stop>
              </linearGradient>
            </defs>
            <!-- Kreisbahn, die oben (12 Uhr) beginnt und im Uhrzeigersinn läuft -->
            <path class="ring__track" d="M100 14 A86 86 0 0 1 100 186 A86 86 0 0 1 100 14"></path>
            <path class="ring__value" id="ringValue"
                  d="M100 14 A86 86 0 0 1 100 186 A86 86 0 0 1 100 14"></path>
            <circle class="ring__head" id="ringHead" cx="100" cy="14" r="6.5"></circle>
          </svg>

          <div class="ring__center">
            <p class="ring__primary" id="ringPrimary">0:00 h</p>
            <p class="ring__link" id="ringLink">von</p>
            <p class="ring__secondary" id="ringSecondary">17:00 h</p>
          </div>
        </div>

        <p class="ring__caption" id="ringCaption">&nbsp;</p>

        <!-- Fastenbeginn/-ende sind zugleich die Einstellung:
             Antippen macht die Uhrzeit direkt an Ort und Stelle änderbar. -->
        <div class="anchors" id="anchorsBlock">
          <div class="anchors__row">
            <div class="anchor">
              <span class="anchor__label">Fastenbeginn</span>
              <button class="anchor__time" type="button" id="editStart"
                      aria-expanded="false" aria-controls="anchorsEditor"
                      aria-label="Fastenbeginn ändern">
                <span id="anchorStartTime">19:00</span>
                <svg class="anchor__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
                  <path d="M14.5 5.5l4 4"></path>
                </svg>
              </button>
              <input class="anchor__input" type="time" step="60" id="inputStart"
                     aria-label="Fastenbeginn" autocomplete="off" hidden>
            </div>

            <span class="anchor__rule" aria-hidden="true"></span>

            <div class="anchor anchor--end">
              <span class="anchor__label">Fastenende</span>
              <button class="anchor__time" type="button" id="editEnd"
                      aria-expanded="false" aria-controls="anchorsEditor"
                      aria-label="Fastenende ändern">
                <span id="anchorEndTime">12:00</span>
                <svg class="anchor__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
                  <path d="M14.5 5.5l4 4"></path>
                </svg>
              </button>
              <input class="anchor__input" type="time" step="60" id="inputEnd"
                     aria-label="Fastenende" autocomplete="off" hidden>
            </div>
          </div>

          <div class="anchors__editor" id="anchorsEditor" hidden>
            <p class="anchors__summary" id="settingsSummary" aria-live="polite"></p>
            <p class="anchors__error" id="settingsError" role="alert" hidden></p>
            <p class="anchors__hint">Gilt täglich. Nur auf diesem Gerät gespeichert.</p>
            <div class="anchors__actions">
              <button class="link-button" type="button" id="settingsReset">Zurücksetzen</button>
              <button class="link-button link-button--accent" type="button" id="settingsDone">Fertig</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ===================== Karten & Timeline ===================== -->
      <section class="stack">

        <article class="card card--goal" id="goalCard" hidden>
          <h2 class="card__title" id="goalTitle"></h2>
          <p class="card__body" id="goalBody"></p>
        </article>

        <article class="card card--now">
          <p class="card__eyebrow card__eyebrow--badge">Jetzt</p>
          <h2 class="card__title" id="nowTitle"></h2>
          <p class="card__meta" id="nowMeta"></p>
          <p class="card__lead" id="nowLead"></p>
          <p class="card__body" id="nowBody"></p>
        </article>

        <article class="card card--next">
          <p class="card__eyebrow">Als Nächstes</p>
          <h2 class="card__title" id="nextTitle"></h2>
          <p class="card__lead" id="nextLead"></p>
          <p class="card__body" id="nextBody"></p>
        </article>

        <section class="phases" aria-labelledby="phasesTitle">
          <h2 class="phases__title" id="phasesTitle">Fastenphasen</h2>
          <ol class="phases__list" id="phaseList"></ol>
        </section>

      </section>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./settings.js"></script>
  <script src="./fasting.js"></script>
  <script src="./app.js"></script>
</body>
</html>
